apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
//apply from: 'publish-maven.gradle'
apply from: '../jacoco.gradle'
apply plugin: 'com.panaxeo.shadow-aar'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'androidx.room'

android {
    namespace 'com.sendsay.sdk'
    compileSdk 35

    buildFeatures {
        buildConfig = true
        viewBinding true
    }

    defaultConfig {
        minSdkVersion 17
        targetSdk 35
        buildConfigField "String", "SENDSAY_VERSION_NAME", '"0.1.4"'
        buildConfigField "int", "SENDSAY_VERSION_CODE", "14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
        testBuildType "unitTesting"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

//    kotlinOptions { jvmTarget = "17" }
    kotlin {
        jvmToolchain(21)
    }

    lintOptions {
        warning "MissingPermission"
    }

    buildTypes {
        release {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            debuggable false
            minifyEnabled true
            proguardFiles(
                    getDefaultProguardFile("proguard-android.txt"),
                    "proguard-rules.pro"
            )
        }
        debug {
            testCoverageEnabled  true
        }
        unitTesting {
            initWith debug
            defaultConfig.minSdkVersion 19
        }
    }

    room {
        schemaDirectory("$projectDir/schemas")
    }

    ksp {
        arg("room.generateKotlin", "true")
    }

    testOptions.unitTests.includeAndroidResources = true
    testOptions {
        unitTests.all {
            jvmArgs '-Xmx2g'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Database
    implementation("androidx.room:room-runtime:$room_version")
    implementation 'androidx.compose.ui:ui-text-desktop:1.7.0'
    annotationProcessor("androidx.room:room-compiler:$room_version")

    // To use Kotlin symbol processing tool (ksp)
    ksp("androidx.room:room-compiler:$room_version")

    implementation "com.squareup.okhttp3:okhttp:$okhttp3_version"
    // Deserialization
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.danilopianini:gson-extras:2.0.0'
    // OkHttp Debugger Logger
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp3_version"
    // Google WorkManager
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    // View for in-app messages
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'
    // Okhttp HTTP compression interceptor
    implementation "com.squareup.okhttp3:okhttp-brotli:$okhttp3_version"
    // Html handling for in-app freeform messages
    implementation 'org.jsoup:jsoup:1.15.4'
    // Images handling
    implementationEmbed 'io.coil-kt:coil:2.0.0'
    implementationEmbed 'io.coil-kt:coil-base:2.0.0'
    implementationEmbed 'io.coil-kt:coil-gif:2.0.0'
    implementationEmbed 'io.coil-kt:coil-svg:2.0.0'
    // Custom Tabs
    implementation 'androidx.browser:browser:1.5.0'
    // Kotlin reflection
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    // Kotlin DateTime
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'
    // Android X prefs
//    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.preference:preference-ktx:1.2.1"
    // Co-Routines
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    // Google AD ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'

    // Base Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.4.0'
    testImplementation 'androidx.test:core-ktx:1.4.0'
    // Kotlin jUnit
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.2.40'
    // Networking Testing
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttp3_version"
    testImplementation 'com.github.gmazzo:okhttp-mock:1.4.1'
    // Improved Unit Testing
    testImplementation "org.robolectric:robolectric:4.14.1"
    // Mockk
    testImplementation "io.mockk:mockk:1.12.8"
    // WorkManager testing
    testImplementation 'androidx.work:work-testing:2.4.0'
    // Chucker debug intent
    debugImplementation "com.github.chuckerteam.chucker:library:4.1.0"
}

shadowAar {
    transformR = "com.sendsay.sdk.R"
    repackages.put("coil", "freeze.coil")
}

// turn logging for unit tests
tasks.withType(Test) {
    systemProperty "robolectric.logging", "stdout"
}
